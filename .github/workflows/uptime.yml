# PrimeCircle, is alles nog in de lucht?
#
# WAAROM DIT HIER STAAT EN NIET OP DE VPS. Op 2026-08-28 lag de complete
# klantenportefeuille er minstens een half uur uit en gaf niets een signaal.
# Een bewaker die op de bewaakte machine draait, gaat mee onderuit en zwijgt
# precies wanneer het ertoe doet. GitHub Actions staat er los van.
#
# HOE JE HET TE HOREN KRIJGT. Bij een storing wordt hier een issue geopend, en
# GitHub mailt de eigenaar van de repository daarover. Dat is bewust: geen
# sleutels, geen extern account, geen SMTP-gegevens die kunnen verlopen. Zodra
# alles weer draait, sluit hetzelfde issue zichzelf met een bericht erbij.
#
# WAT DIT NIET IS. GitHub voert geplande taken uit "op zijn best": onder drukte
# loopt een cron tien tot twintig minuten achter, en soms slaat er een over. Dat
# is prima om te horen dát je eruit ligt, en te weinig als je op de seconde wilt
# weten hoe lang. Wil je dat laatste, dan is een betaalde dienst het antwoord en
# niet dit bestand.

name: uptime

on:
  schedule:
    # Elke tien minuten. Vaker heeft weinig zin: GitHub knijpt korte intervallen
    # af en de vertraging is toch al groter dan het interval.
    - cron: '*/10 * * * *'
  workflow_dispatch:        # met de hand te draaien
    inputs:
      lijst:
        description: 'Welke lijst. sites-test.json is met opzet stuk, om te oefenen.'
        required: false
        default: 'sites.json'
        type: choice
        options: [sites.json, sites-test.json]

permissions:
  contents: read
  issues: write             # nodig om het storings-issue te openen en te sluiten

concurrency:
  # Twee tegelijk zouden twee issues openen voor dezelfde storing.
  group: uptime
  cancel-in-progress: false

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Controleer alle adressen
        id: controle
        run: |
          set +e
          LIJST="${{ inputs.lijst || 'sites.json' }}"
          echo "Lijst: $LIJST"
          node tools/uptime/controleer.mjs --sites="$LIJST" > /tmp/leesbaar.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/leesbaar.txt
          {
            echo 'rapport<<UITKOMST'
            cat /tmp/leesbaar.txt
            echo 'UITKOMST'
          } >> "$GITHUB_OUTPUT"

      - name: Meld of sluit
        uses: actions/github-script@v7
        env:
          CODE: ${{ steps.controle.outputs.code }}
          RAPPORT: ${{ steps.controle.outputs.rapport }}
        with:
          script: |
            const stuk = process.env.CODE !== '0';
            const rapport = process.env.RAPPORT || '(geen rapport)';
            const merk = 'uptime';
            const titel = 'Storing: er is iets niet bereikbaar';

            // Eén lopend issue tegelijk, anders regent het meldingen bij een
            // storing die een uur duurt.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: merk
            });
            const lopend = open.data[0];
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${rapport}\n\nGecontroleerd op ${new Date().toISOString()}.\nDraaide hier: ${run}`;

            if (stuk && !lopend) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titel, labels: [merk],
                body: `${body}\n\nDit issue sluit zichzelf zodra alles weer antwoordt.`
              });
              core.setFailed('Er is iets stuk, issue geopend.');
            } else if (stuk && lopend) {
              // Nog steeds stuk: bijschrijven in plaats van een nieuw issue.
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: lopend.number, body
              });
              core.setFailed('Nog steeds stuk, bijgeschreven op het lopende issue.');
            } else if (!stuk && lopend) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: lopend.number,
                body: `Alles antwoordt weer.\n\n${body}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: lopend.number, state: 'closed'
              });
              core.notice('Hersteld, issue gesloten.');
            } else {
              core.notice('Alles in de lucht.');
            }
