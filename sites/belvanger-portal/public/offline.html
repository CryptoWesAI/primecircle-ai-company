<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0e1a24">
  <title>Geen verbinding &middot; Belvanger</title>
  <style>
    /* Bewust inline en zonder webfont: deze pagina moet werken als er niets
       anders geladen kan worden. */
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px;
      background: #0e1a24; color: #f4f2ed;
      font-family: Archivo, Arial, "Helvetica Neue", sans-serif; text-align: center;
    }
    .card { max-width: 22rem; }
    svg { width: 56px; height: 56px; margin-bottom: 20px; }
    h1 { font-size: 1.35rem; line-height: 1.3; margin: 0 0 12px; }
    p { margin: 0 0 22px; color: #b6bfc7; line-height: 1.55; }
    button {
      font: inherit; font-weight: 700; color: #fff; background: #ff5a1f;
      border: 0; border-radius: 12px; padding: 13px 24px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M15 42A24 24 0 0 1 49 20" fill="none" stroke="#f4f2ed" stroke-width="7" stroke-linecap="round"/>
      <circle cx="49" cy="20" r="8" fill="#ff5a1f"/>
    </svg>
    <h1>Even geen verbinding</h1>
    <p>
      Je telefoon heeft nu geen internet. Je gemiste oproepen worden nog steeds
      opgevangen en de automatische sms is al verstuurd, dus er gaat niets verloren.
    </p>
    <button type="button" onclick="location.reload()">Opnieuw proberen</button>
  </div>
</body>
</html>
