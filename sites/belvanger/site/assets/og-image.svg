<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Archivo, 'Arial Black', 'Segoe UI', Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="100%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#FF5C1A" stop-opacity=".28"/>
      <stop offset="55%" stop-color="#FF5C1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#16232E"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- merkmerk -->
  <g transform="translate(80,74)">
    <path d="M2 20a13 13 0 0 1 20-11.5" fill="none" stroke="#FAF9F6" stroke-width="3.4" stroke-linecap="round" transform="scale(1.5)"/>
    <circle cx="33" cy="12.5" r="6" fill="#FF5C1A"/>
    <text x="56" y="24" fill="#FAF9F6" font-size="30" font-weight="800" letter-spacing="-0.5">Belvanger</text>
  </g>

  <!-- kop: maat afgestemd op de brede fallback (Arial Black), botst niet met de chatkaart -->
  <text x="80" y="272" fill="#FAF9F6" font-size="74" font-weight="900" letter-spacing="-2">Mis nooit meer</text>
  <text x="80" y="352" fill="#FAF9F6" font-size="74" font-weight="900" letter-spacing="-2">een <tspan fill="#FF5C1A">klant</tspan>.</text>
  <rect x="80" y="368" width="196" height="8" rx="4" fill="#FF5C1A"/>

  <!-- subregel -->
  <text x="80" y="440" fill="#A9B4BD" font-size="27" font-weight="500">De belletjes die jij mist, vangen wij op.</text>
  <text x="80" y="476" fill="#A9B4BD" font-size="27" font-weight="500">Automatisch, met een bericht.</text>

  <!-- trustregel -->
  <g transform="translate(80,560)" fill="#6B7078" font-size="22" font-weight="600">
    <text x="0" y="16">Voor loodgieters · installateurs · dakdekkers · elektriciens</text>
  </g>

  <!-- WhatsApp-vangst rechts -->
  <g transform="translate(760,150)">
    <rect x="0" y="0" width="360" height="330" rx="26" fill="#0E171E" opacity=".55"/>
    <!-- gemiste oproep -->
    <g transform="translate(28,34)">
      <rect x="0" y="0" width="180" height="34" rx="17" fill="#FFFFFF" opacity=".1"/>
      <circle cx="20" cy="17" r="5" fill="#FF5C1A"/>
      <text x="36" y="23" fill="#FAF9F6" font-size="15" font-weight="700" opacity=".85">Gemiste oproep · 14:32</text>
    </g>
    <!-- uitgaande vangst-bubbel -->
    <g transform="translate(58,92)">
      <rect x="0" y="0" width="274" height="96" rx="16" fill="#D6F5C8"/>
      <text x="16" y="30" fill="#16232E" font-size="16" font-weight="600">Sorry, we misten je belletje!</text>
      <text x="16" y="54" fill="#16232E" font-size="16" font-weight="600">Waarmee kunnen we helpen?</text>
      <text x="16" y="78" fill="#16232E" font-size="16" font-weight="600" opacity=".55">We bellen zo terug.</text>
    </g>
    <!-- antwoord -->
    <g transform="translate(28,204)">
      <rect x="0" y="0" width="252" height="70" rx="16" fill="#FAF9F6"/>
      <text x="16" y="29" fill="#16232E" font-size="16" font-weight="600">Ja hoi! M'n kraan lekt.</text>
      <text x="16" y="52" fill="#16232E" font-size="16" font-weight="600">Kunnen jullie vandaag?</text>
    </g>
    <!-- lead binnen -->
    <g transform="translate(28,292)">
      <circle cx="8" cy="8" r="7" fill="#1FA855"/>
      <text x="26" y="14" fill="#4BD98A" font-size="16" font-weight="800">Nieuwe lead binnen</text>
    </g>
  </g>
</svg>
