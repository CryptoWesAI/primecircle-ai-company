# Geïsoleerd Docker-project: Belvanger (website + chat-assistent in één container).
# Node-chatbotserver serveert de statische site + /api/chat + /api/config same-origin.
# Eigen container + eigen netwerk → geen vermenging met andere projecten op de VPS.
services:
  belvanger:
    build: .
    image: belvanger:latest
    container_name: belvanger
    restart: unless-stopped
    # Achter de bestaande Traefik reverse proxy → domein + automatisch HTTPS.
    labels:
      - "traefik.enable=true"
      # belvanger.primecircle.cloud (oud staging-adres) bewust NIET meer geroute:
      # zelfde container/code als belvanger.nl, dus tracking/cookies zouden daar
      # ook meelopen. Uitgezet op 2026-07-21.
      - "traefik.http.routers.belvanger.rule=Host(`belvanger.nl`) || Host(`www.belvanger.nl`)"
      - "traefik.http.routers.belvanger.entrypoints=websecure"
      - "traefik.http.routers.belvanger.tls=true"
      - "traefik.http.routers.belvanger.tls.certresolver=letsencrypt"
      - "traefik.http.services.belvanger.loadbalancer.server.port=8092"
      # bvaanbod.primecircle.cloud: serveert de offer-pagina via dezelfde container; de root
      # stuurt door naar /aanbod.html. Assets (css/fonts) en andere paden gaan gewoon door.
      - "traefik.http.routers.bvaanbod.rule=Host(`bvaanbod.primecircle.cloud`)"
      - "traefik.http.routers.bvaanbod.entrypoints=websecure"
      - "traefik.http.routers.bvaanbod.tls=true"
      - "traefik.http.routers.bvaanbod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bvaanbod.service=belvanger"
      - "traefik.http.routers.bvaanbod.middlewares=bvaanbod-root@docker"
      - "traefik.http.middlewares.bvaanbod-root.redirectregex.regex=^https://bvaanbod.primecircle.cloud/?$$"
      - "traefik.http.middlewares.bvaanbod-root.redirectregex.replacement=https://bvaanbod.primecircle.cloud/aanbod.html"
    env_file:
      - .env
    environment:
      PORT: "8092"
      STATIC_DIR: /app/site
      CUSTOMER: "belvanger"
      DATA_DIR: /app/data
      RATE_LIMIT_PER_MIN: "${RATE_LIMIT_PER_MIN:-30}"
      LOG_QUESTIONS: "false"
      DASHBOARD_TOKEN: "${DASHBOARD_TOKEN:-}"
      # Zonder deze regel valt de server terug op "*", en dan mag ELKE website de chat-API
      # aanroepen. Iemand kan de widget dan op zijn eigen site zetten en de gesprekken van
      # zijn bezoekers op onze OpenRouter-rekening laten lopen. Eigen pagina's raken dit niet:
      # verzoeken vanaf dezelfde herkomst gaan sowieso niet door CORS heen.
      ALLOWED_ORIGIN: "https://belvanger.nl"
    volumes:
      # analytics (JSONL) blijft bewaard over herbouw heen
      - belvanger-data:/app/data
    networks:
      - belvanger
    # Runaway-grens, geen krappe toewijzing. Zonder limiet kan één weggelopen proces het
    # geheugen van de hele VPS opeten, en dan valt AB Uitvaartzorg mee om — een klantsite
    # die plat gaat door onze eigen site. Node zit hier normaal rond de 80-150 MB.
    # LET OP: een te lage limiet vertraagt niet, die KILLT. Zie infra/LIMIETEN.md.
    mem_limit: 384m
    # Zonder dit groeit het logbestand ongelimiteerd tot de schijf vol is.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  belvanger:
    name: belvanger

volumes:
  belvanger-data:
    name: belvanger-data
