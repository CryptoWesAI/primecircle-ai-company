# Security headers for sable.primecircle.cloud. Included in the server block
# and again in every location that sets its own add_header, because nginx
# drops inherited add_headers the moment a location adds one of its own.
#
# The content policy is strict on purpose: scripts only from this host and
# jsdelivr (viem for the receipt verifier; the ElevenLabs widget if ever
# enabled), connections only to this host and jsdelivr (viem loads chunks),
# no frames, no plugins, no inline scripts. Inline style attributes are
# allowed because the ladder bars and tick marks are positioned inline.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.elevenlabs.io https://storage.googleapis.com; font-src 'self'; connect-src 'self' https://cdn.jsdelivr.net https://api.elevenlabs.io wss://api.elevenlabs.io https://api.us.elevenlabs.io wss://api.us.elevenlabs.io; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
