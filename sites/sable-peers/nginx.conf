# sable.primecircle.cloud: a static page plus a read-only, allow-listed,
# cached proxy to a handful of public data endpoints, so that
#   - the page can show live Sable status and the live signer address
#     (Sable's API sends no CORS headers for outside origins), and
#   - the visitor's browser never talks to CoinGecko, DexScreener or GitHub
#     directly: this host fetches, caches, and serves. No visitor IP, cookie
#     or header ever reaches those services.
#
# Every proxied URL is fixed here. Nothing from the request is forwarded:
# no query string, no headers, no body. GET and HEAD only. One upstream
# request per endpoint per cache window regardless of visitor count, and
# the last good answer is served if an upstream stalls.
#
# Runs in nginxinc/nginx-unprivileged: no root, port 8080, read-only root
# filesystem with /tmp on tmpfs for the cache and the pid file.
proxy_cache_path /tmp/sable-cache levels=1 keys_zone=sable:1m max_size=10m inactive=1d;
server_tokens off;

limit_req_zone $binary_remote_addr zone=board:1m rate=3r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/snippets/security-headers.conf;

    # Fly and GitHub publish AAAA records; the container network has no IPv6
    # route. Resolve at request time through Docker DNS with IPv6 off, which
    # requires every upstream to be held in a variable.
    resolver 127.0.0.11 ipv6=off valid=300s;
    set $sable   https://api.buildsable.com;
    set $gh      https://raw.githubusercontent.com;
    set $board   http://sable-board:8787;
    set $cg      https://api.coingecko.com;
    set $dex     https://api.dexscreener.com;
    set $sol     https://api.mainnet-beta.solana.com;

    # ---- Sable's public API: status, signer, models ----
    location ~ ^/sable-api/(status|receipts/pubkey|models|nodes)$ {
        limit_except GET { deny all; }
        proxy_pass $sable/v1/$1;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Host api.buildsable.com;
        proxy_cache_key "sable:$1";
        proxy_cache_valid 200 60s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache $upstream_cache_status always;
        add_header Cache-Control "no-store" always;
    }
    location /sable-api/ { return 404; }

    # ---- the public record (this project's own repository) ----
    # the game's leaderboard: a small service on the compose network, same origin
    location /api/game/ {
        limit_except GET POST { deny all; }
        limit_req zone=board burst=12 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        rewrite ^/api/game/(.*)$ /$1 break;
        proxy_pass $board;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        proxy_send_timeout 8s;
        proxy_buffering off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /ext/whitepaper {
        limit_except GET { deny all; }
        proxy_pass $gh/CryptoWesAI/sable-whitepaper-watch/main/whitepaper.json;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Host raw.githubusercontent.com;
        proxy_cache_key "ext:whitepaper";
        proxy_cache_valid 200 120s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache $upstream_cache_status always;
        add_header Cache-Control "no-store" always;
    }

    location = /ext/record {
        limit_except GET { deny all; }
        proxy_pass $gh/CryptoWesAI/sable-whitepaper-watch/main/record.json;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Host raw.githubusercontent.com;
        proxy_cache_key "ext:record";
        proxy_cache_valid 200 120s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache $upstream_cache_status always;
        add_header Cache-Control "no-store" always;
        add_header Content-Type "application/json" always;
    }
    location = /ext/peers {
        limit_except GET { deny all; }
        proxy_pass $gh/CryptoWesAI/sable-whitepaper-watch/main/peers-record.json;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Host raw.githubusercontent.com;
        proxy_cache_key "ext:peers";
        proxy_cache_valid 200 300s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache $upstream_cache_status always;
        add_header Cache-Control "no-store" always;
        add_header Content-Type "application/json" always;
    }
    location = /ext/ledger {
        limit_except GET { deny all; }
        proxy_pass $gh/CryptoWesAI/sable-whitepaper-watch/main/status/log.jsonl;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Host raw.githubusercontent.com;
        proxy_cache_key "ext:ledger";
        proxy_cache_valid 200 120s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache $upstream_cache_status always;
        add_header Cache-Control "no-store" always;
        add_header Content-Type "text/plain; charset=utf-8" always;
    }

    # ---- market data, fixed queries ----
    location = /ext/markets {
        limit_except GET { deny all; }
        proxy_pass $cg/api/v3/coins/markets?vs_currency=usd&ids=automata,marlin,secret,pha,opengradient,nillion,iexec-rlc,oasis-network,akash-network,virtual-protocol,bittensor,near&per_page=50&page=1&sparkline=false&price_change_percentage=30d;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Host api.coingecko.com;
        proxy_cache_key "ext:markets";
        proxy_cache_valid 200 120s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache $upstream_cache_status always;
        add_header Cache-Control "no-store" always;
    }
    # SABL's mint on Solana: the supply and the mint account. The public RPC refuses
    # browser origins, so this host asks, with a body written here and nothing from
    # the visitor. Two fixed questions, one answer a minute at most.
    # the app's manifest, with its own media type (nginx's table has none for .webmanifest)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    location = /ext/supply {
        limit_except GET { deny all; }
        proxy_method POST;
        proxy_set_header Content-Type application/json;
        proxy_set_body '{"jsonrpc":"2.0","id":1,"method":"getTokenSupply","params":["DaPayqzdCXcrmvgz9Wx7MySipXxcSofGPtkMgVdqpump"]}';
        proxy_pass $sol/;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Host api.mainnet-beta.solana.com;
        proxy_cache_key "ext:supply";
        proxy_cache_valid 200 60s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache $upstream_cache_status always;
        add_header Cache-Control "no-store" always;
    }
    location = /ext/mint {
        limit_except GET { deny all; }
        proxy_method POST;
        proxy_set_header Content-Type application/json;
        proxy_set_body '{"jsonrpc":"2.0","id":1,"method":"getAccountInfo","params":["DaPayqzdCXcrmvgz9Wx7MySipXxcSofGPtkMgVdqpump",{"encoding":"jsonParsed"}]}';
        proxy_pass $sol/;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Host api.mainnet-beta.solana.com;
        proxy_cache_key "ext:mint";
        proxy_cache_valid 200 600s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache $upstream_cache_status always;
        add_header Cache-Control "no-store" always;
    }
    location = /ext/sabl {
        limit_except GET { deny all; }
        proxy_pass $dex/latest/dex/tokens/DaPayqzdCXcrmvgz9Wx7MySipXxcSofGPtkMgVdqpump;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Host api.dexscreener.com;
        proxy_cache_key "ext:sabl";
        proxy_cache_valid 200 60s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Cache $upstream_cache_status always;
        add_header Cache-Control "no-store" always;
    }
    location /ext/ { return 404; }

    # ---- the page and its assets ----
    location /fonts/ { expires 30d; add_header Cache-Control "public, max-age=2592000, immutable" always; include /etc/nginx/snippets/security-headers.conf; }
    location ~* \.(png|jpg|svg|ico|js)$ { expires 1h; include /etc/nginx/snippets/security-headers.conf; }
    location / { try_files $uri $uri/ =404; }
}
