# Shared by every proxied location. The visitor's request is not forwarded:
# no headers, no cookies, no body, no query. Only what is set explicitly.
proxy_pass_request_headers off;
proxy_pass_request_body off;
proxy_set_header User-Agent "sable.primecircle.cloud read-only cached proxy (+https://sable.primecircle.cloud)";
proxy_set_header Accept "application/json, text/plain;q=0.9, */*;q=0.5";
proxy_set_header Accept-Encoding "";
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_connect_timeout 3s;
proxy_read_timeout 6s;
proxy_cache sable;
proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock on;
proxy_ignore_headers Cache-Control Expires Set-Cookie;
proxy_hide_header Set-Cookie;
proxy_hide_header Via;
proxy_hide_header Fly-Request-Id;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header X-Cache;
proxy_hide_header X-Served-By;
proxy_hide_header X-GitHub-Request-Id;
proxy_hide_header X-Fastly-Request-Id;
proxy_hide_header Cf-Ray;
proxy_hide_header Alt-Svc;
